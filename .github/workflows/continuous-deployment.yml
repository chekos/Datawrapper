name: Continuous deployment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint and format Python code
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - id: install-python
        name: Install Python
        run: uv python install 3.13

      - id: install-python-dependencies
        name: Install Python dependencies
        run: uv sync --frozen --extra dev --extra test

      - id: check-ruff
        name: Check with Ruff
        run: uv run ruff check ./datawrapper ./tests

      - id: format-ruff
        name: Check formatting with Ruff
        run: uv run ruff format --check ./datawrapper ./tests

  mypy-python:
    name: Check Python static typing
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - id: install-python
        name: Install Python
        run: uv python install 3.13

      - id: install-python-dependencies
        name: Install Python dependencies
        run: uv sync --frozen --extra mypy

      - id: mypy
        name: Run mypy
        run: uv run mypy ./datawrapper --ignore-missing-imports

  test-python:
    name: Test Python code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - id: install-python
        name: Install Python
        run: uv python install ${{ matrix.python }}

      - id: install-python-dependencies
        name: Install Python dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python }}
        shell: bash

      - id: tests
        name: Run tests
        run: uv run pytest
        shell: bash

  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    needs: [lint-python, mypy-python, test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - id: install-python
        name: Install Python
        run: uv python install 3.13

      - id: build
        name: Build releases
        run: uv build --sdist --wheel
        shell: bash

      - id: save
        name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error

  release:
    name: PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - id: fetch
        name: Fetch artifact
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ./dist

      - id: publish
        name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          verify_metadata: false
